services:
  app:
    build: .
    container_name: asean-cs-agent
    restart: unless-stopped
    ports:
      - "8792:8792"
    environment:
      - PORT=8792
      - ADMIN_TOKEN=change-me-please
      - CLASS_CODE=ASEAN2026
      - PUBLIC_BASE_URL=http://localhost:8792
    volumes:
      - ./data:/app/data
